[package]
name = "writer-desktop"
version = "0.2.0"
edition = "2021"
rust-version = "1.90"
license = "MIT"
description = "Cáscara Tauri de writer"

[workspace]

[lib]
name = "writer_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.3", features = [] }

[dependencies]
tauri = { version = "=2.12.4", features = [] }
tauri-plugin-dialog = "=2.8.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ts-rs = "=12.0.1"
writer-core = { path = "../../../crates/core", version = "0.1.0" }

[dev-dependencies]
tempfile = "3.14"
