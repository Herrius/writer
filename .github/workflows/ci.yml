name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"

jobs:
  calidad:
    name: Calidad y paquetes (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Instalar Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable

      - name: Dependencias de Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential curl wget file libssl-dev \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev patchelf rpm

      - name: Activar pnpm
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@12.14.0 --activate

      - name: Instalar dependencias JS
        run: pnpm install --frozen-lockfile

      - name: Formato Rust
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Tests Rust
        run: cargo test --workspace --all-targets --locked

      - name: Tipos y tests de la UI
        run: |
          pnpm typecheck
          pnpm ui:test

      - name: Build de la UI
        run: pnpm ui:build

      - name: Tests de la cáscara Tauri
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --locked

      - name: Instaladores
        run: pnpm build

  e2e:
    name: E2E navegador (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Activar pnpm
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@12.14.0 --activate

      - name: Instalar dependencias JS
        run: pnpm install --frozen-lockfile

      - name: Instalar Chromium (Linux)
        if: runner.os == 'Linux'
        run: pnpm exec playwright install --with-deps chromium

      - name: Instalar Chromium (Windows)
        if: runner.os == 'Windows'
        run: pnpm exec playwright install chromium

      - name: E2E
        run: pnpm e2e

  e2e-tauri-windows:
    name: E2E escritorio Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Instalar Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Activar pnpm
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@12.14.0 --activate

      - name: Instalar dependencias JS
        run: pnpm install --frozen-lockfile

      - name: Instalar tauri-driver
        run: cargo install tauri-driver --version 2.0.6 --locked

      - name: Instalar msedgedriver
        shell: pwsh
        run: |
          $edge = "${env:ProgramFiles(x86)}\Microsoft\Edge\Application\msedge.exe"
          if (-not (Test-Path $edge)) {
            $edge = "$env:ProgramFiles\Microsoft\Edge\Application\msedge.exe"
          }
          if (-not (Test-Path $edge)) {
            throw "no se encontró Microsoft Edge"
          }
          $version = (Get-Item $edge).VersionInfo.ProductVersion
          $destino = Join-Path $env:RUNNER_TEMP "msedgedriver"
          New-Item -ItemType Directory -Path $destino -Force | Out-Null
          $zip = Join-Path $destino "msedgedriver.zip"
          $urls = @(
            "https://msedgedriver.microsoft.com/$version/edgedriver_win64.zip",
            "https://msedgedriver.azureedge.net/$version/edgedriver_win64.zip"
          )
          $descargado = $false
          foreach ($url in $urls) {
            try {
              Invoke-WebRequest -Uri $url -OutFile $zip -UseBasicParsing
              $descargado = $true
              break
            } catch {
              Write-Host "no se pudo descargar $url"
            }
          }
          if (-not $descargado) {
            throw "no se pudo descargar msedgedriver $version"
          }
          Expand-Archive -Path $zip -DestinationPath $destino -Force
          $driver = Get-ChildItem -Path $destino -Recurse -Filter msedgedriver.exe |
            Select-Object -First 1
          if (-not $driver) {
            throw "el ZIP de msedgedriver no contiene msedgedriver.exe"
          }
          "MSEDGEDRIVER=$($driver.FullName)" |
            Out-File -FilePath $env:GITHUB_ENV -Append -Encoding ascii

      - name: E2E Tauri
        shell: pwsh
        run: ./scripts/e2e-tauri.ps1
