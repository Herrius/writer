name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  crear-release:
    name: Crear release borrador
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Crear borrador si no existe
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --draft \
              --title "writer $TAG" \
              --notes "Instaladores de writer $TAG. Linux: .deb/.rpm. Windows: .msi/.exe. Paquetes sin firma."
          fi

  paquetes:
    name: Paquetes (${{ matrix.os }})
    needs: crear-release
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Instalar Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Dependencias de Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential curl wget file libssl-dev \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev patchelf rpm

      - name: Activar pnpm
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@12.14.0 --activate

      - name: Instalar dependencias JS
        run: pnpm install --frozen-lockfile

      - name: Compilar e instalar
        run: pnpm build

      - name: Subir paquetes al release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            files=(apps/desktop/src-tauri/target/release/bundle/deb/*.deb \
                   apps/desktop/src-tauri/target/release/bundle/rpm/*.rpm)
          else
            files=(apps/desktop/src-tauri/target/release/bundle/msi/*.msi \
                   apps/desktop/src-tauri/target/release/bundle/nsis/*.exe)
          fi
          if [ ${#files[@]} -eq 0 ]; then
            echo "No se generó ningún instalador" >&2
            exit 1
          fi
          gh release upload "$TAG" "${files[@]}" --clobber
